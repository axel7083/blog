name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The public repo holds published posts only; drafts and research notes live in the private repo.
      - name: No drafts or private notes
        if: github.repository == 'axel7083/blog'
        run: |
          if grep -rlE '^draft:\s*true' src/content/posts; then
            echo "::error::draft posts belong in the private repo"; exit 1
          fi
          if ls docs/nas-* 2>/dev/null; then
            echo "::error::docs/nas-* are private research notes"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
